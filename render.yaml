services:
  - type: web
    name: locallens-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://locallens-ai-frontend.onrender.com,https://locallens-ai.pages.dev,http://localhost:5173,http://127.0.0.1:5173
